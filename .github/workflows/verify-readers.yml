name: Verify reading projects

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: bookshelf
      - uses: actions/checkout@v4
        with:
          repository: wupzl/pytorch-apprentice
          ref: main
          path: pytorch-apprentice
      - uses: actions/checkout@v4
        with:
          repository: wupzl/ai-era-reader
          ref: main
          path: ai-era-reader
      - uses: actions/checkout@v4
        with:
          repository: wupzl/data-empire-reader
          ref: main
          path: data-empire-reader
      - uses: actions/checkout@v4
        with:
          repository: wupzl/rag-empire-reader
          ref: main
          path: rag-empire-reader
      - uses: actions/checkout@v4
        with:
          repository: wupzl/system-design-reader
          ref: main
          path: system-design-reader
      - uses: actions/checkout@v4
        with:
          repository: wupzl/online-troubleshooting-reader
          ref: main
          path: online-troubleshooting-reader
      - uses: actions/checkout@v4
        with:
          repository: wupzl/coding-agent-reader
          ref: main
          path: coding-agent-reader
      - uses: actions/checkout@v4
        with:
          repository: wupzl/interview-proof-reader
          ref: main
          path: interview-proof-reader
      - uses: actions/checkout@v4
        with:
          repository: wupzl/langchain-empire-reader
          ref: main
          path: langchain-empire-reader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser checks
        run: |
          python -m pip install -r bookshelf/requirements-test.txt -r system-design-reader/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Verify bookshelf and all nine readers
        run: python bookshelf/verify.py
      - name: Verify production troubleshooting reader
        run: python online-troubleshooting-reader/verify.py
      - name: Verify Coding Agent reading features
        run: python coding-agent-reader/verify.py
      - name: Verify interview reader features
        run: python interview-proof-reader/verify.py
      - name: Verify LangChain reader features
        run: python langchain-empire-reader/verify.py
      - name: Verify system design reader
        run: python system-design-reader/verify.py
      - name: Verify PyTorch reading features
        shell: bash
        run: |
          python -m http.server 4174 --directory pytorch-apprentice/docs --bind 127.0.0.1 > "$RUNNER_TEMP/pytorch-reader-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python pytorch-apprentice/verify.py
      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-projects-verification
          path: |
            bookshelf-validation/
            pytorch-apprentice/test-results/
            system-design-reader/test-results/
            online-troubleshooting-reader/test-results/
            coding-agent-reader/test-results/
            interview-proof-reader/test-results/
            langchain-empire-reader/test-results/
          if-no-files-found: ignore
